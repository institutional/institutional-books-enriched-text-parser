[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibllm-parser"
version = "0.1.0"
description = "Simplified filter utility for Institutional Books LLM datasets on HuggingFace"
readme = "README.md"
authors = [
  {name = "David Lowry-Duda", email="dlowry@law.harvard.edu"},
  {name = "davidlowryduda", email="david@lowryduda.com"},
]
requires-python = ">=3.10"
dependencies = []
license = {text = "AGPL-3.0-or-later"}
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[project.urls]
Homepage = "https://github.com/institutional/ibllm_parser"

[dependency-groups]
dev = [
    "pyarrow>=24.0.0",
    "pytest>=8.0",
]
